<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault of the Sunken Ledger</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c10; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vault of the Sunken Ledger: a top-down bank heist. Move with WASD or arrows, sneak with Shift, click to throw a coin lure, Space for smoke. Avoid guard and camera vision cones or the alarm meter fills."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
